name: Build sideloadable IPA

# Builds Stride on GitHub's free macOS runners — no Mac required on your end.
# Produces an UNSIGNED .ipa as a downloadable artifact. AltServer (running on
# your Windows laptop) does the actual Apple signing when it installs the app
# onto your iPhone, using your free Apple ID.
#
# Trigger manually from the Actions tab, or on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        # The runner's aws/tap is untrusted by default and blocks any brew
        # install since Homebrew 4.x's tap-trust check — irrelevant to us,
        # so bypass it rather than fight it.
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Select Xcode
        # Pick whatever the newest installed Xcode is rather than pinning a
        # version — the runner image's bundled version changes over time.
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Report build errors
        # Raw Action logs require sign-in to view. Put the actual compiler
        # errors in the Job Summary instead, which renders on the public
        # run page with no auth needed. Whichever log exists is the one
        # that failed.
        if: failure()
        run: |
          {
            echo '### Build failure — first errors found'
            echo '```'
            if [ -f xcodebuild.log ]; then
              grep -E "error:" xcodebuild.log -A 4 | head -c 6000
            fi
            if [ -f xcodegen.log ]; then
              cat xcodegen.log | head -c 3000
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package as .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/Stride.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Stride.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned
          path: Stride.ipa
          retention-days: 14
