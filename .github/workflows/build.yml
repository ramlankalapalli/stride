name: Build sideloadable IPA

# Builds Stride on GitHub's free macOS runners — no Mac required on your end.
# Produces an UNSIGNED .ipa as a downloadable artifact. AltServer (running on
# your Windows laptop) does the actual Apple signing when it installs the app
# onto your iPhone, using your free Apple ID.
#
# Trigger manually from the Actions tab, or on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package as .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/Stride.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Stride.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned
          path: Stride.ipa
          retention-days: 14
