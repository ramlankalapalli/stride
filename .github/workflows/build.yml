name: Build and publish to TestFlight

# Builds Stride on GitHub's free macOS runners, signs it automatically using
# an App Store Connect API key via fastlane (no manual certificates/profiles
# to manage), and uploads straight to TestFlight. Install/update the app
# purely from the TestFlight app on the iPhone — no laptop, no cable, no
# AltServer.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # match needs to push the encrypted certs branch

jobs:
  build:
    # Apple's validation server now requires apps be built with the iOS 26
    # SDK (Xcode 26+). macos-14 only has Xcode up to 16.2 installed —
    # macos-latest tracks GitHub's newest image, which stays current with
    # new Xcode releases much sooner.
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      API_KEY_PATH: /tmp/AuthKey.p8
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and fastlane
        # The runner's aws/tap is untrusted by default and blocks any brew
        # install since Homebrew 4.x's tap-trust check — irrelevant to us,
        # so bypass it rather than fight it.
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen
          gem install fastlane --no-document

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Select Xcode
        # Pick whatever the newest installed Xcode is rather than pinning a
        # version — the runner image's bundled version changes over time.
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)

      - name: Install App Store Connect API key
        run: echo "$APP_STORE_CONNECT_API_KEY_P8" > "$API_KEY_PATH"
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Build and upload to TestFlight
        # Safety net: if this genuinely hangs (as opposed to just being
        # slow), fail it well before GitHub's multi-hour default timeout so
        # it doesn't sit stuck for hours unnoticed — this happened once
        # already (codesign waiting on an unreachable keychain prompt).
        timeout-minutes: 15
        run: |
          set -o pipefail
          fastlane ios beta 2>&1 | tee fastlane.log

      - name: Report build errors
        # Raw Action logs require sign-in to view. Put the actual error in
        # the Job Summary instead, which renders on the public run page with
        # no auth needed. Runs on timeout too (counts as failure), and
        # includes the MARK progress lines so a hang shows exactly which
        # step it never got past.
        if: failure()
        run: |
          {
            echo '### Build failure — last errors found'
            echo '```'
            for f in fastlane.log xcodegen.log; do
              if [ -f "$f" ]; then
                echo "--- $f progress markers ---"
                grep "MARK:" "$f" || echo "(no MARK lines reached)"
                echo "--- $f errors ---"
                grep -iE "error|failed" "$f" -A 3 | tail -c 4000
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
