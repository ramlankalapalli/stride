name: Build and publish to TestFlight

# Builds Stride on GitHub's free macOS runners, signs it automatically using
# an App Store Connect API key (no manual certificates/profiles to manage —
# xcodebuild fetches/creates what it needs), and uploads straight to
# TestFlight. Install/update the app purely from the TestFlight app on the
# iPhone — no laptop, no cable, no AltServer.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        # The runner's aws/tap is untrusted by default and blocks any brew
        # install since Homebrew 4.x's tap-trust check — irrelevant to us,
        # so bypass it rather than fight it.
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Select Xcode
        # Pick whatever the newest installed Xcode is rather than pinning a
        # version — the runner image's bundled version changes over time.
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Archive
        # Unsigned on purpose. Automatic signing during a plain `archive`
        # action has no way to know this is headed for App Store
        # distribution and keeps resolving to a Development certificate
        # (which then fails — CI has no registered device). The export step
        # below has unambiguous intent (method: app-store-connect) and does
        # all the real signing, so the archive itself doesn't need to.
        run: |
          set -o pipefail
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -archivePath build/Stride.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee archive.log

      - name: Export .ipa for TestFlight
        run: |
          set -o pipefail
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Stride.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/export/Stride.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            2>&1 | tee upload.log

      - name: Report build errors
        # Raw Action logs require sign-in to view. Put the actual compiler
        # errors in the Job Summary instead, which renders on the public
        # run page with no auth needed. Whichever log exists at the point
        # of failure is the one that gets shown.
        if: failure()
        run: |
          {
            echo '### Build failure — first errors found'
            echo '```'
            for f in archive.log export.log upload.log xcodegen.log; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                grep -E "error:|Error " "$f" -A 4 | head -c 4000
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
