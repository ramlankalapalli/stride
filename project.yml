name: Stride

options:
  bundleIdPrefix: com.ramlankalapalli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # TODO: your team id
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - path: Stride
      - path: Shared
      # Phase 1.1B prototype only — the animated Avaturn/Mixamo USDZ used by
      # the internal-testing 3D Avatar Lab. Explicitly a resource: XcodeGen
      # has no build-phase rule for .usdz and would otherwise have to guess.
      # Only in the app target; the widget has no use for it.
      - path: PrototypeAssets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramlankalapalli.stride
        INFOPLIST_FILE: Stride/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stride/Stride.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: StrideWidget
        embed: true
    # Phase 1.0.5: attaches StrideTests to Stride's auto-generated scheme so
    # `xcodebuild test -scheme Stride` runs the unit tests without a
    # separate hand-authored scheme file.
    scheme:
      testTargets:
        - StrideTests
    # TODO(open): HealthKit / Sign in with Apple / push / App Groups are
    # dropped for the first TestFlight build — none were enabled on the App
    # ID, and none are load-bearing for the app to run (HealthKit connect
    # fails gracefully to an error message, notifications are local-only and
    # don't need aps-environment, the widget just shows its placeholder
    # state without the app group). Add these back once the basic build is
    # confirmed working, matching whatever capabilities get enabled on the
    # App ID at that point.
    entitlements:
      path: Stride/Stride.entitlements
      properties: {}

  StrideWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StrideWidget
      # Shares the plain-SwiftUI design tokens with the app target — no
      # dependency on Models/Copy/Logic, so it compiles standalone here.
      # Lives in a top-level Shared/ folder (not nested inside Stride/) —
      # XcodeGen mis-resolves a cross-target source path that's nested
      # inside another target's own folder with a `group:` override,
      # producing a doubled/broken file path at build time.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramlankalapalli.stride.widget
        INFOPLIST_FILE: StrideWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StrideWidget/StrideWidget.entitlements
    entitlements:
      path: StrideWidget/StrideWidget.entitlements
      properties: {}

  # Phase 1.0.5: the project had zero tests before this. Pure-logic-only —
  # no UI tests, no CoreMotion/HealthKit hardware dependency, so it runs on
  # any simulator without special permissions.
  StrideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrideTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramlankalapalli.stride.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Stride
