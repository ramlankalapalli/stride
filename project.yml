name: Stride

options:
  bundleIdPrefix: com.stride
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # TODO: your team id
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - path: Stride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stride.app
        INFOPLIST_FILE: Stride/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stride/Stride.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: StrideWidget
        embed: true
    entitlements:
      path: Stride/Stride.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.stride.app

  StrideWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StrideWidget
      # Shares the plain-SwiftUI design tokens with the app target — no
      # dependency on Models/Copy/Logic, so it compiles standalone here.
      - path: Stride/Design
        group: Design
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stride.app.widget
        INFOPLIST_FILE: StrideWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StrideWidget/StrideWidget.entitlements
    entitlements:
      path: StrideWidget/StrideWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stride.app
